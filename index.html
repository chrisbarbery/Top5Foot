<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Le Top 5 — Résultats des 5 grands championnats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte Équipe de France */
  --bleu-nuit:#001B49;      /* bleu profond FFF */
  --bleu:#002654;           /* bleu drapeau */
  --bleu-clair:#1C3F7A;
  --rouge:#CE1126;          /* rouge drapeau */
  --blanc:#FFFFFF;
  --ivoire:#F4F6FA;
  --or:#C9A227;             /* clin d'œil au coq doré */
  --gris:#8A93A6;
  --vert-live:#1FA45B;
  --radius:14px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--ivoire);
  color:var(--bleu-nuit);
  min-height:100vh;
}

/* ---------- Liseré tricolore (signature) ---------- */
.tricolore{height:6px;display:flex;width:100%}
.tricolore span{flex:1}
.tricolore span:nth-child(1){background:var(--bleu)}
.tricolore span:nth-child(2){background:var(--blanc)}
.tricolore span:nth-child(3){background:var(--rouge)}

/* ---------- En-tête ---------- */
header{
  background:linear-gradient(135deg,var(--bleu-nuit) 0%,var(--bleu) 70%,#003A7A 100%);
  color:var(--blanc);
  padding:18px 16px 0;
  position:sticky;top:0;z-index:50;
  box-shadow:0 4px 18px rgba(0,27,73,.35);
}
.head-top{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.coq{
  width:42px;height:42px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#103568,var(--bleu-nuit));
  border:2px solid var(--or);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;flex-shrink:0;
}
h1{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,4.5vw,32px);letter-spacing:.5px;text-transform:uppercase;line-height:1}
h1 small{display:block;font-family:var(--font-body);font-weight:500;font-size:11px;letter-spacing:2.5px;color:#9DB3D9;text-transform:uppercase;margin-top:3px}
.refresh-zone{display:flex;align-items:center;gap:10px}
#countdown{font-family:var(--font-display);font-weight:600;font-size:14px;color:#9DB3D9;min-width:46px;text-align:right}
#btn-refresh{
  font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:1px;text-transform:uppercase;
  background:var(--rouge);color:var(--blanc);border:none;border-radius:999px;
  padding:9px 18px;cursor:pointer;display:flex;align-items:center;gap:7px;
  transition:transform .15s,background .2s;
}
#btn-refresh:hover{background:#E31B30;transform:translateY(-1px)}
#btn-refresh:active{transform:scale(.97)}
#btn-refresh .ico{display:inline-block;transition:transform .6s}
#btn-refresh.spin .ico{transform:rotate(360deg)}

/* Onglets championnats */
.leagues{
  display:flex;gap:6px;max-width:1100px;margin:14px auto 0;
  overflow-x:auto;scrollbar-width:none;padding-bottom:0;
}
.leagues::-webkit-scrollbar{display:none}
.league-tab{
  font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.5px;
  color:#9DB3D9;background:transparent;border:none;cursor:pointer;
  padding:10px 16px 12px;white-space:nowrap;
  border-bottom:3px solid transparent;
  display:flex;align-items:center;gap:8px;
  transition:color .2s;
}
.league-tab img{width:20px;height:20px;object-fit:contain;filter:grayscale(1) brightness(2);opacity:.6;transition:.2s}
.league-tab:hover{color:var(--blanc)}
.league-tab.active{color:var(--blanc);border-bottom-color:var(--rouge)}
.league-tab.active img{filter:none;opacity:1}

/* ---------- Sous-navigation ---------- */
.subnav{
  max-width:1100px;margin:18px auto 0;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.view-switch{display:flex;background:var(--blanc);border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(0,27,73,.08)}
.view-switch button{
  font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.8px;text-transform:uppercase;
  border:none;background:transparent;color:var(--gris);padding:8px 20px;border-radius:999px;cursor:pointer;transition:.2s;
}
.view-switch button.active{background:var(--bleu);color:var(--blanc)}
.round-nav{display:flex;align-items:center;gap:10px}
.round-nav button{
  width:36px;height:36px;border-radius:50%;border:1.5px solid var(--bleu);background:var(--blanc);
  color:var(--bleu);font-size:16px;cursor:pointer;transition:.15s;font-weight:700;
}
.round-nav button:hover{background:var(--bleu);color:var(--blanc)}
.round-nav button:disabled{opacity:.3;cursor:default}
#round-label{font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:1px;min-width:120px;text-align:center}

/* ---------- Contenu ---------- */
main{max-width:1100px;margin:16px auto 60px;padding:0 16px}
#status{
  text-align:center;font-size:13px;color:var(--gris);margin:8px 0 14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--vert-live);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.matches{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.day-sep{
  grid-column:1/-1;font-family:var(--font-display);font-weight:700;font-size:16px;
  text-transform:uppercase;letter-spacing:2px;color:var(--bleu);
  border-bottom:2px solid var(--bleu);padding-bottom:4px;margin-top:8px;
}

/* Carte match */
.match{
  background:var(--blanc);border-radius:var(--radius);padding:14px 16px;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,27,73,.07);
  border-left:4px solid var(--bleu);
  transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;
}
.match:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,27,73,.14)}
.match.live{border-left-color:var(--vert-live)}
.match.finished{border-left-color:var(--rouge)}
.m-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gris);margin-bottom:10px;font-weight:500;letter-spacing:.3px}
.m-meta .badge-live{color:var(--vert-live);font-weight:700;display:flex;align-items:center;gap:5px}
.m-meta .badge-fin{color:var(--rouge);font-weight:700}
.m-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.m-row img{width:28px;height:28px;object-fit:contain;flex-shrink:0}
.m-row .crest-fallback{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:800;font-size:12px;color:var(--blanc);
}
.m-row .name{font-weight:600;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-row .score{font-family:var(--font-display);font-weight:800;font-size:22px;min-width:26px;text-align:center}
.m-row.winner .name,.m-row.winner .score{color:var(--bleu)}
.m-row.loser .name,.m-row.loser .score{color:var(--gris)}
.m-venue{font-size:12px;color:var(--gris);margin-top:8px;display:flex;align-items:center;gap:5px}
.m-extra{font-size:11.5px;font-weight:700;color:var(--rouge);margin-top:4px;letter-spacing:.5px}

/* ---------- Classement ---------- */
table.standings{width:100%;border-collapse:collapse;background:var(--blanc);border-radius:var(--radius);overflow:hidden;box-shadow:0 2px 10px rgba(0,27,73,.07)}
.standings th{
  font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;
  background:var(--bleu-nuit);color:var(--blanc);padding:11px 8px;text-align:center;
}
.standings th:nth-child(2){text-align:left}
.standings td{padding:10px 8px;text-align:center;font-size:14px;border-bottom:1px solid #E6EAF2}
.standings td.team{text-align:left;font-weight:600;display:flex;align-items:center;gap:9px}
.standings td.team img{width:22px;height:22px;object-fit:contain}
.standings tr:hover td{background:#F0F4FB}
.standings .pos{font-family:var(--font-display);font-weight:800;font-size:16px}
.standings .pts{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--bleu)}
.standings tr.ucl .pos{color:var(--bleu);border-left:4px solid var(--bleu)}
.standings tr.releg .pos{color:var(--rouge);border-left:4px solid var(--rouge)}

/* ---------- Modale détail match ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(0,20,55,.65);backdrop-filter:blur(3px);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
}
#overlay.open{display:flex}
@media(min-width:640px){#overlay.open{align-items:center}}
.modal{
  background:var(--blanc);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;animation:slideUp .25s ease;
}
@media(min-width:640px){.modal{border-radius:20px}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{
  background:linear-gradient(135deg,var(--bleu-nuit),var(--bleu));color:var(--blanc);
  padding:22px 20px 18px;position:relative;
}
.modal-head .close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
  border:none;background:rgba(255,255,255,.15);color:var(--blanc);font-size:17px;cursor:pointer;
}
.modal-score{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.modal-team{flex:1;text-align:center}
.modal-team img{width:54px;height:54px;object-fit:contain}
.modal-team .nm{font-family:var(--font-display);font-weight:700;font-size:17px;margin-top:6px;line-height:1.1}
.modal-mid{text-align:center}
.modal-mid .sc{font-family:var(--font-display);font-weight:800;font-size:44px;letter-spacing:2px}
.modal-mid .st{font-size:12px;color:#9DB3D9;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.modal-body{padding:18px 20px 26px}
.info-line{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--bleu-nuit);margin-bottom:7px}
.info-line .lbl{color:var(--gris);min-width:70px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.section-title{
  font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--bleu);margin:18px 0 8px;border-bottom:2px solid var(--bleu);padding-bottom:4px;
  display:flex;align-items:center;gap:7px;
}
.event-line{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;border-bottom:1px dashed #E6EAF2}
.event-line .min{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--rouge);min-width:38px}
.event-line .side{font-size:11px;color:var(--gris);margin-left:auto;font-weight:600}
.card-ic{display:inline-block;width:11px;height:15px;border-radius:2px;flex-shrink:0}
.card-ic.j{background:#F2C200}.card-ic.r{background:var(--rouge)}
.tag-pen{font-size:10.5px;font-weight:700;color:var(--blanc);background:var(--rouge);border-radius:4px;padding:1px 5px;letter-spacing:.5px}
.no-data{font-size:13px;color:var(--gris);font-style:italic;padding:6px 0}

/* ---------- États ---------- */
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0;color:var(--gris)}
.spinner{width:42px;height:42px;border-radius:50%;border:4px solid #DDE4F0;border-top-color:var(--rouge);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.error-box{
  background:var(--blanc);border-radius:var(--radius);padding:28px 22px;text-align:center;
  border-top:4px solid var(--rouge);box-shadow:0 2px 10px rgba(0,27,73,.07);max-width:520px;margin:30px auto;
}
.error-box h3{font-family:var(--font-display);font-size:21px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.error-box p{font-size:14px;color:var(--gris);line-height:1.5}
.error-box button{
  margin-top:14px;font-family:var(--font-display);font-weight:700;letter-spacing:1px;text-transform:uppercase;
  background:var(--bleu);color:var(--blanc);border:none;border-radius:999px;padding:10px 24px;cursor:pointer;
}
footer{text-align:center;font-size:11.5px;color:var(--gris);padding:18px 16px 30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="tricolore"><span></span><span></span><span></span></div>

<header>
  <div class="head-top">
    <div class="brand">
      <div class="coq">🐓</div>
      <h1>Le Top 5<small>Les 5 grands championnats d'Europe</small></h1>
    </div>
    <div class="refresh-zone">
      <span id="countdown">60 s</span>
      <button id="btn-refresh" aria-label="Actualiser les données"><span class="ico">⟳</span> Actualiser</button>
    </div>
  </div>
  <nav class="leagues" id="league-tabs" aria-label="Championnats"></nav>
</header>

<div class="subnav">
  <div class="view-switch" role="tablist">
    <button id="v-cal" class="active">Calendrier</button>
    <button id="v-cls">Classement</button>
  </div>
  <div class="round-nav" id="round-nav">
    <button id="r-prev" aria-label="Journée précédente">‹</button>
    <span id="round-label">Journée —</span>
    <button id="r-next" aria-label="Journée suivante">›</button>
  </div>
</div>

<main>
  <div id="status"></div>
  <div id="content"><div class="loader"><div class="spinner"></div><span>Chargement des données…</span></div></div>
</main>

<div id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<footer>
  Données fournies par TheSportsDB (API publique gratuite). Mise à jour automatique toutes les 60 secondes.<br>
  Niveau de détail (buteurs, cartons, minute) selon la disponibilité de l'API pour chaque match.
</footer>

<script>
/* =====================================================================
   CONFIGURATION — API TheSportsDB (clé publique gratuite "3")
   Les API officielles des fédérations (FFF, FA, RFEF, FIGC, DFB) ne sont
   pas ouvertes au public sans contrat ; TheSportsDB agrège leurs données.
   Pour brancher une autre source (ex. football-data.org avec votre clé),
   il suffit d'adapter les fonctions fetch* ci-dessous.
===================================================================== */
const API = 'https://www.thesportsdb.com/api/v1/json/3';
const SEASON = '2025-2026';
const LEAGUES = [
  {id:'4334', name:'Ligue 1',        country:'🇫🇷', rounds:34},
  {id:'4328', name:'Premier League', country:'🏴', rounds:38},
  {id:'4335', name:'La Liga',        country:'🇪🇸', rounds:38},
  {id:'4332', name:'Serie A',        country:'🇮🇹', rounds:38},
  {id:'4331', name:'Bundesliga',     country:'🇩🇪', rounds:34},
];
const REFRESH_EVERY = 60; // secondes

/* ---------------- État ---------------- */
let curLeague = LEAGUES[0];
let curView   = 'cal';          // 'cal' | 'cls'
let curRound  = null;           // numéro de journée
let teamCache = {};             // {leagueId: {teamName: {badge,color}}}
let countdown = REFRESH_EVERY;
let timerId   = null;

/* ---------------- Utilitaires ---------------- */
const $ = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function initials(name){
  return name.split(/\s+/).filter(w=>w.length>2||/^[A-Z]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'??';
}
function hashColor(name){
  let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0;
  const palette=['#002654','#CE1126','#1C3F7A','#7A1B2E','#0E5A3C','#5A3A7A','#7A5A0E'];
  return palette[h%palette.length];
}
function crest(team, lid){
  const t = (teamCache[lid]||{})[team];
  if(t && t.badge) return `<img src="${t.badge}/tiny" alt="" loading="lazy" onerror="this.outerHTML=crestFallbackHTML('${esc(team)}')">`;
  return crestFallbackHTML(team);
}
function crestFallbackHTML(team){
  return `<span class="crest-fallback" style="background:${hashColor(team)}">${initials(team)}</span>`;
}
window.crestFallbackHTML = crestFallbackHTML;

function fmtDate(ev){
  if(!ev.dateEvent) return '';
  const d = new Date(ev.dateEvent + 'T' + (ev.strTime||'00:00:00') + 'Z');
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function fmtTime(ev){
  if(!ev.strTime) return '';
  const d = new Date(ev.dateEvent + 'T' + ev.strTime + 'Z');
  return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function matchStatus(ev){
  const s = (ev.strStatus||'').toUpperCase();
  if(['FT','MATCH FINISHED','AET','PEN','FINISHED'].includes(s) || (ev.intHomeScore!=null && ev.intAwayScore!=null && !['1H','2H','HT','LIVE'].includes(s)))
    return 'finished';
  if(['1H','2H','HT','LIVE','ET','IN PLAY'].includes(s)) return 'live';
  return 'upcoming';
}
function durationLabel(ev){
  const s = (ev.strStatus||'').toUpperCase();
  if(s==='AET') return 'A.P. — 120 min (prolongation)';
  if(s==='PEN') return 'T.A.B. — prolongation + tirs au but';
  return '90 min';
}

/* ---------------- Chargement équipes (blasons + couleurs) ---------------- */
async function loadTeams(lid){
  if(teamCache[lid]) return;
  try{
    const data = await getJSON(`${API}/lookup_all_teams.php?id=${lid}`);
    const map = {};
    (data.teams||[]).forEach(t=>{
      map[t.strTeam] = {badge:t.strBadge||t.strTeamBadge||'', color:t.strColour1||hashColor(t.strTeam)};
      if(t.strTeamAlternate) t.strTeamAlternate.split(',').forEach(a=>{ if(a.trim()) map[a.trim()]=map[t.strTeam]; });
    });
    teamCache[lid]=map;
  }catch(e){ teamCache[lid]={}; }
}

/* ---------------- Journée courante ---------------- */
async function detectCurrentRound(lid){
  try{
    const d = await getJSON(`${API}/eventsnextleague.php?id=${lid}`);
    if(d.events && d.events.length && d.events[0].intRound) return parseInt(d.events[0].intRound);
  }catch(e){}
  try{
    const d = await getJSON(`${API}/eventspastleague.php?id=${lid}`);
    if(d.events && d.events.length && d.events[0].intRound) return parseInt(d.events[0].intRound);
  }catch(e){}
  return 1;
}

/* ---------------- Rendu calendrier ---------------- */
function parseGoalDetails(str, side){
  // format TheSportsDB : "34':Joueur;67':Joueur (pen.);"
  if(!str) return [];
  return str.split(';').map(x=>x.trim()).filter(Boolean).map(g=>{
    const m = g.match(/(\d+)'?\s*:?\s*(.*)/);
    const min = m? m[1] : '';
    let name = m? m[2] : g;
    const pen = /pen|p\.|\(p\)/i.test(name);
    name = name.replace(/\(?\s*pen(alty)?\.?\s*\)?/ig,'').replace(/\(p\)/ig,'').trim();
    return {min, name, pen, side};
  });
}
function parseCards(yStr, rStr, side){
  const out=[];
  const parse=(str,type)=>{ if(!str) return;
    str.split(';').map(x=>x.trim()).filter(Boolean).forEach(c=>{
      const m=c.match(/(\d+)'?\s*:?\s*(.*)/);
      out.push({min:m?m[1]:'', name:m?m[2]:c, type, side});
    });
  };
  parse(yStr,'j'); parse(rStr,'r');
  return out;
}

function renderMatches(events){
  if(!events.length){
    $('#content').innerHTML = `<div class="error-box"><h3>Aucun match</h3><p>Aucune rencontre programmée pour cette journée.</p></div>`;
    return;
  }
  events.sort((a,b)=> (a.dateEvent+a.strTime).localeCompare(b.dateEvent+b.strTime));
  let html = '<div class="matches">', lastDay='';
  for(const ev of events){
    const day = fmtDate(ev);
    if(day!==lastDay){ html += `<div class="day-sep">${esc(day)}</div>`; lastDay=day; }
    const st = matchStatus(ev);
    const hs = ev.intHomeScore, as = ev.intAwayScore;
    const played = hs!=null && as!=null;
    const meta = st==='live' ? `<span class="badge-live"><span class="dot-live"></span>EN DIRECT</span>`
               : st==='finished' ? `<span class="badge-fin">TERMINÉ · ${durationLabel(ev)}</span>`
               : `<span>${fmtTime(ev)}</span>`;
    const wH = played && +hs > +as, wA = played && +as > +hs;
    html += `
    <article class="match ${st}" data-evid="${ev.idEvent}" tabindex="0" role="button" aria-label="Détail ${esc(ev.strHomeTeam)} ${played?hs+'-'+as:'contre'} ${esc(ev.strAwayTeam)}">
      <div class="m-meta">${meta}<span>J${ev.intRound||'?'}</span></div>
      <div class="m-row ${wH?'winner':wA?'loser':''}">${crest(ev.strHomeTeam,curLeague.id)}<span class="name">${esc(ev.strHomeTeam)}</span><span class="score">${played?hs:'–'}</span></div>
      <div class="m-row ${wA?'winner':wH?'loser':''}">${crest(ev.strAwayTeam,curLeague.id)}<span class="name">${esc(ev.strAwayTeam)}</span><span class="score">${played?as:'–'}</span></div>
      ${ev.strVenue? `<div class="m-venue">🏟️ ${esc(ev.strVenue)}</div>`:''}
      ${(ev.strStatus||'').toUpperCase()==='AET'?'<div class="m-extra">APRÈS PROLONGATION</div>':''}
      ${(ev.strStatus||'').toUpperCase()==='PEN'?'<div class="m-extra">AUX TIRS AU BUT</div>':''}
    </article>`;
  }
  html += '</div>';
  $('#content').innerHTML = html;
  document.querySelectorAll('.match').forEach(el=>{
    el.addEventListener('click',()=>openDetail(el.dataset.evid, events));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter') openDetail(el.dataset.evid, events); });
  });
}

/* ---------------- Modale détail ---------------- */
async function openDetail(id, events){
  let ev = events.find(e=>e.idEvent===id);
  $('#overlay').classList.add('open');
  $('#modal').innerHTML = `<div class="loader"><div class="spinner"></div></div>`;
  try{
    const d = await getJSON(`${API}/lookupevent.php?id=${id}`);
    if(d.events && d.events[0]) ev = d.events[0];
  }catch(e){}

  const played = ev.intHomeScore!=null && ev.intAwayScore!=null;
  const goals = [
    ...parseGoalDetails(ev.strHomeGoalDetails, 'home'),
    ...parseGoalDetails(ev.strAwayGoalDetails, 'away'),
  ].sort((a,b)=>(+a.min||0)-(+b.min||0));
  const cards = [
    ...parseCards(ev.strHomeYellowCards, ev.strHomeRedCards, 'home'),
    ...parseCards(ev.strAwayYellowCards, ev.strAwayRedCards, 'away'),
  ].sort((a,b)=>(+a.min||0)-(+b.min||0));

  const sideName = s => s==='home'? ev.strHomeTeam : ev.strAwayTeam;
  const goalsHTML = goals.length
    ? goals.map(g=>`<div class="event-line"><span class="min">${esc(g.min)}'</span>⚽ <strong>${esc(g.name)}</strong>${g.pen?' <span class="tag-pen">PEN.</span>':''}<span class="side">${esc(sideName(g.side))}</span></div>`).join('')
    : `<div class="no-data">${played?'Détail des buteurs non communiqué par l\u2019API pour ce match.':'Match non joué.'}</div>`;
  const cardsHTML = cards.length
    ? cards.map(c=>`<div class="event-line"><span class="min">${esc(c.min)}'</span><span class="card-ic ${c.type}"></span><strong>${esc(c.name)}</strong><span class="side">${esc(sideName(c.side))}</span></div>`).join('')
    : `<div class="no-data">${played?'Aucun carton signalé (ou détail non communiqué).':'Match non joué.'}</div>`;

  $('#modal').innerHTML = `
    <div class="modal-head">
      <button class="close" aria-label="Fermer" onclick="document.getElementById('overlay').classList.remove('open')">✕</button>
      <div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9DB3D9;font-weight:600">${esc(curLeague.name)} · Journée ${ev.intRound||'?'} · ${fmtDate(ev)}</div>
      <div class="modal-score">
        <div class="modal-team">${crest(ev.strHomeTeam,curLeague.id).replace('width:28','width:54')}<div class="nm">${esc(ev.strHomeTeam)}</div></div>
        <div class="modal-mid">
          <div class="sc">${played? ev.intHomeScore+' – '+ev.intAwayScore : fmtTime(ev)}</div>
          <div class="st">${matchStatus(ev)==='live'?'EN DIRECT':matchStatus(ev)==='finished'? 'Terminé · '+durationLabel(ev) : 'À venir'}</div>
        </div>
        <div class="modal-team">${crest(ev.strAwayTeam,curLeague.id).replace('width:28','width:54')}<div class="nm">${esc(ev.strAwayTeam)}</div></div>
      </div>
    </div>
    <div class="modal-body">
      <div class="info-line"><span class="lbl">Stade</span>🏟️ ${esc(ev.strVenue||'Non communiqué')}</div>
      <div class="info-line"><span class="lbl">Durée</span>⏱️ ${played? durationLabel(ev) : '90 min (prévu)'}</div>
      ${ev.strResult && (ev.strStatus||'').toUpperCase()==='PEN' ? `<div class="info-line"><span class="lbl">T.A.B.</span>${esc(ev.strResult)}</div>`:''}
      <div class="section-title">⚽ Buteurs</div>
      ${goalsHTML}
      <div class="section-title">🟨🟥 Cartons</div>
      ${cardsHTML}
    </div>`;
}
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') $('#overlay').classList.remove('open'); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('#overlay').classList.remove('open'); });

/* ---------------- Classement ---------------- */
async function renderStandings(){
  $('#content').innerHTML = `<div class="loader"><div class="spinner"></div><span>Chargement du classement…</span></div>`;
  try{
    const d = await getJSON(`${API}/lookuptable.php?l=${curLeague.id}&s=${SEASON}`);
    const rows = d.table||[];
    if(!rows.length) throw new Error('vide');
    let html = `<table class="standings"><thead><tr>
      <th>#</th><th>Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>Diff</th><th>Pts</th>
    </tr></thead><tbody>`;
    rows.forEach(r=>{
      const pos = +r.intRank;
      const cls = pos<=4 ? 'ucl' : pos > rows.length-3 ? 'releg' : '';
      const badge = r.strBadge ? `<img src="${r.strBadge}/tiny" alt="" loading="lazy">` : crest(r.strTeam, curLeague.id);
      html += `<tr class="${cls}">
        <td class="pos">${pos}</td>
        <td class="team">${badge}${esc(r.strTeam)}</td>
        <td>${r.intPlayed}</td><td>${r.intWin}</td><td>${r.intDraw}</td><td>${r.intLoss}</td>
        <td>${r.intGoalsFor}</td><td>${r.intGoalsAgainst}</td>
        <td>${r.intGoalDifference>0?'+':''}${r.intGoalDifference}</td>
        <td class="pts">${r.intPoints}</td></tr>`;
    });
    html += '</tbody></table>';
    $('#content').innerHTML = html;
  }catch(e){
    showError('Classement indisponible', 'Le classement de cette saison n\u2019est pas encore publié par l\u2019API. Réessayez plus tard.');
  }
}

/* ---------------- Chargement principal ---------------- */
async function loadView(showLoader=true){
  if(showLoader) $('#content').innerHTML = `<div class="loader"><div class="spinner"></div><span>Chargement…</span></div>`;
  $('#round-nav').style.visibility = curView==='cal' ? 'visible' : 'hidden';
  try{
    await loadTeams(curLeague.id);
    if(curView==='cls'){ await renderStandings(); }
    else{
      if(curRound==null) curRound = await detectCurrentRound(curLeague.id);
      $('#round-label').textContent = `Journée ${curRound}`;
      $('#r-prev').disabled = curRound<=1;
      $('#r-next').disabled = curRound>=curLeague.rounds;
      const d = await getJSON(`${API}/eventsround.php?id=${curLeague.id}&r=${curRound}&s=${SEASON}`);
      renderMatches(d.events||[]);
    }
    $('#status').innerHTML = `<span class="dot-live"></span> Dernière mise à jour : ${new Date().toLocaleTimeString('fr-FR')}`;
  }catch(e){
    showError('Connexion impossible',
      'L\u2019application n\u2019a pas pu joindre l\u2019API de données football. '+
      'Si vous consultez ce fichier dans l\u2019aperçu Claude, les requêtes externes peuvent être bloquées : '+
      'téléchargez le fichier et ouvrez-le directement dans Safari ou Chrome pour un fonctionnement complet.');
  }
}
function showError(title, msg){
  $('#content').innerHTML = `<div class="error-box"><h3>${esc(title)}</h3><p>${msg}</p><button onclick="loadView()">Réessayer</button></div>`;
}

/* ---------------- Navigation ---------------- */
function buildTabs(){
  $('#league-tabs').innerHTML = LEAGUES.map(l=>
    `<button class="league-tab ${l.id===curLeague.id?'active':''}" data-id="${l.id}">${l.country} ${l.name}</button>`
  ).join('');
  document.querySelectorAll('.league-tab').forEach(b=>b.addEventListener('click',()=>{
    curLeague = LEAGUES.find(l=>l.id===b.dataset.id);
    curRound = null;
    buildTabs(); resetCountdown(); loadView();
  }));
}
$('#v-cal').addEventListener('click',()=>{ curView='cal'; $('#v-cal').classList.add('active'); $('#v-cls').classList.remove('active'); loadView(); });
$('#v-cls').addEventListener('click',()=>{ curView='cls'; $('#v-cls').classList.add('active'); $('#v-cal').classList.remove('active'); loadView(); });
$('#r-prev').addEventListener('click',()=>{ if(curRound>1){curRound--; loadView();} });
$('#r-next').addEventListener('click',()=>{ if(curRound<curLeague.rounds){curRound++; loadView();} });

/* ---------------- Rafraîchissement (60 s + bouton) ---------------- */
function resetCountdown(){ countdown = REFRESH_EVERY; $('#countdown').textContent = countdown+' s'; }
function startTimer(){
  if(timerId) clearInterval(timerId);
  timerId = setInterval(()=>{
    countdown--;
    $('#countdown').textContent = countdown+' s';
    if(countdown<=0){ resetCountdown(); loadView(false); }
  },1000);
}
$('#btn-refresh').addEventListener('click',()=>{
  const b=$('#btn-refresh'); b.classList.add('spin'); setTimeout(()=>b.classList.remove('spin'),650);
  resetCountdown(); loadView(false);
});

/* ---------------- Démarrage ---------------- */
buildTabs();
loadView();
startTimer();
</script>
</body>
</html>
